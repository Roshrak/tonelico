model:
  provider: aistudio2api
  default: gemini-4-argon
  max_tokens: 65536
  aliases:
    aistudio: aistudio2api/gemini-4-argon
    aistudio-pro: aistudio2api/gemini-3.1-pro-preview
    argon-high: aistudio2api/gemini-4-argon-high
    argon-med: aistudio2api/gemini-4-argon-medium
    argon-low: aistudio2api/gemini-4-argon-low
    flash-high: aistudio2api/gemini-3.8-flash-high
    flash-med: aistudio2api/gemini-3.8-flash-medium
    flash-low: aistudio2api/gemini-3.8-flash-low
    fast: aistudio2api/gemma-4-26b-a4b-it
    flash: aistudio2api/gemini-3.8-flash
    lite: agy-rotator/gemini-3.1-flash-lite
    tab-lite: agy-rotator/tab_flash_lite_preview
providers:
  agy-rotator:
    api: http://127.0.0.1:8045/v1
    default_model: gemini-3.8-flash-high
    key_env: AGY_ROTATOR_API_KEY
  agy-pro:
    api: http://127.0.0.1:8765/v1
    default_model: gemini-3.8-flash-high
    api_key: agy-local-key
  aistudio2api:
    api: http://127.0.0.1:2048/v1
    default_model: gemini-4-argon
    key_env: AISTUDIO2API_API_KEY
fallback_providers: []
credential_pool_strategies:
  gemini: fill_first
  default: fill_first
browser:
  cloud_provider: browser-use
display:
  busy_input_mode: steer
  busy_steer_ack_enabled: false
  busy_text_mode: interrupt
  busy_ack_enabled: false
  tool_progress_grouping: accumulate
  cleanup_progress: true
  platforms:
    telegram:
      tool_progress: all
      tool_progress_grouping: accumulate
      cleanup_progress: true
      thinking_progress: true
      interim_assistant_messages: false
      tool_preview_length: 80
  reasoning: false
telegram:
  streaming: true
  allow_from:
  - '@TELEGRAM_USER_ID@'
  allow_admin_from:
  - '@TELEGRAM_USER_ID@'
approvals:
  mode: false
  cron_mode: auto
  single_query_mode: auto
  unattended_mode: auto
plugins:
  enabled:
  - session-access
  - parallel-orders
  disabled: []
  entries:
    session-access:
      allow_tool_override: false
    parallel-orders:
      allow_tool_override: false
tools:
  terminal:
    auto_approve: true
  execute_code:
    auto_approve: true
  web_search:
    auto_approve: true
  web_extract:
    auto_approve: true
  browser:
    auto_approve: true
onboarding:
  seen:
    busy_input_prompt: true
    profile_build_offered: true
    tool_progress_prompt: true
_config_version: 40
mcp_servers:
  paddleocr:
    command: /home/aesc/.local/bin/paddleocr-mcp-local
    connect_timeout: 240.0
    lazy: true
    idle_timeout_seconds: 60
    enabled: true
  hermes-factory-mcp:
    command: /run/current-system/sw/bin/python3
    args:
    - /home/aesc/.local/lib/factory_mcp_adapter.py
    enabled: true
  agy-control:
    command: /home/aesc/agy-control-mcp/scripts/agy-control-mcp
    args:
    - --client
    - hermes
    connect_timeout: 240
    timeout: 3600
    enabled: true
  doc-scanner-mcp:
    command: /run/current-system/sw/bin/python3
    args:
    - /home/aesc/.local/lib/doc_scanner_mcp.py
    enabled: true
  customs-legal-mcp:
    command: /run/current-system/sw/bin/python3
    args:
    - /home/aesc/.local/lib/customs_legal_mcp.py
    enabled: true
  desktop-computer-use-mcp:
    command: /run/current-system/sw/bin/python3
    args:
    - /home/aesc/.local/lib/desktop_computer_use_mcp.py
    enabled: true
  browser-automation-mcp:
    command: /run/current-system/sw/bin/python3
    args:
    - /home/aesc/.local/lib/browser_automation_mcp.py
    enabled: true
  minecraft-ops-mcp:
    command: /run/current-system/sw/bin/python3
    args:
    - /home/aesc/.local/lib/minecraft_ops_mcp.py
    enabled: true
  discord-ops-mcp:
    command: /run/current-system/sw/bin/python3
    args:
    - /home/aesc/.local/lib/discord_ops_mcp.py
    enabled: true
  fast-chat-mcp:
    command: /run/current-system/sw/bin/python3
    args:
    - /home/aesc/.local/lib/fast_chat_mcp.py
    enabled: true
  parallel-ops-mcp:
    command: /run/current-system/sw/bin/python3
    args:
    - /home/aesc/.local/lib/parallel_ops_mcp.py
    enabled: true
platform_toolsets:
  cli:
  - browser
  - clarify
  - code_execution
  - computer_use
  - connections
  - context_engine
  - cronjob
  - delegation
  - file
  - homeassistant
  - image_gen
  - kanban
  - memory
  - session_search
  - skills
  - spotify
  - stt
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
  - yuanbao
known_plugin_toolsets:
  cli:
  - a2a
  - spotify
known_builtin_toolsets:
  cli:
  - browser
  - clarify
  - code_execution
  - computer_use
  - connections
  - context_engine
  - cronjob
  - delegation
  - discord
  - discord_admin
  - file
  - homeassistant
  - image_gen
  - kanban
  - memory
  - session_search
  - skills
  - spotify
  - stt
  - terminal
  - todo
  - tts
  - video
  - video_gen
  - vision
  - web
  - x_search
  - yuanbao
agent:
  reasoning_effort: low
web:
  backend: keenable
  extract_backend: keenable
