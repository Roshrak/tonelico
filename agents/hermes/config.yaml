model:
  provider: aistudio2api
  default: gemini-4-argon
  max_tokens: 65536
  aliases:
    aistudio: aistudio2api/gemini-4-argon
    aistudio-pro: aistudio2api/gemini-3.1-pro-preview
providers:
  agy-rotator:
    api: http://127.0.0.1:8045/v1
    default_model: gemini-3.8-flash-high
    key_env: AGY_ROTATOR_API_KEY
  agy-pro:
    api: http://127.0.0.1:8765/v1
    default_model: gemini-3.8-flash-high
    api_key: agy-local-key
  aistudio2api:
    api: http://127.0.0.1:2048/v1
    default_model: gemini-4-argon
    api_key: not-needed
fallback_providers:
  - provider: agy-pro
    model: gemini-3.8-flash-high
  - provider: aistudio2api
    model: gemini-3.8-flash
credential_pool_strategies:
  gemini: fill_first
  default: fill_first
browser:
  cloud_provider: browser-use
display:
  busy_input_mode: queue
  busy_steer_ack_enabled: true
  busy_text_mode: queue
  busy_ack_enabled: true
telegram:
  streaming: true
  allow_from:
    - '@TELEGRAM_USER_ID@'
  allow_admin_from:
    - '@TELEGRAM_USER_ID@'
approvals:
  mode: false
  cron_mode: auto
  single_query_mode: auto
  unattended_mode: auto
plugins:
  enabled:
    - session-access
  disabled: []
  entries:
    session-access:
      allow_tool_override: false
tools:
  terminal:
    auto_approve: true
  execute_code:
    auto_approve: true
  web_search:
    auto_approve: true
  web_extract:
    auto_approve: true
  browser:
    auto_approve: true
onboarding:
  seen:
    busy_input_prompt: true
    profile_build_offered: true
    tool_progress_prompt: true
_config_version: 40
mcp_servers:
  paddleocr:
    command: /home/aesc/.local/bin/paddleocr-mcp-local
    connect_timeout: 240.0
    lazy: true
    idle_timeout_seconds: 60
    enabled: true
  hermes-factory-mcp:
    command: /run/current-system/sw/bin/python3
    args:
      - /home/aesc/.local/lib/factory_mcp_adapter.py
    enabled: true
  agy-control:
    command: /home/aesc/agy-control-mcp/scripts/agy-control-mcp
    args:
      - --client
      - hermes
    connect_timeout: 240
    timeout: 3600
    enabled: true
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - file
    - homeassistant
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - video
    - vision
    - web
    - x_search
    - yuanbao
known_plugin_toolsets:
  cli:
    - a2a
    - spotify
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
agent:
  reasoning_effort: xhigh
web:
  backend: keenable
  extract_backend: keenable
