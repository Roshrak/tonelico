services:
  antigravity-manager:
    build:
      context: ./src
      dockerfile: docker/Dockerfile
    image: antigravity-manager:5.0.0-local
    container_name: antigravity-manager
    ports:
      - "127.0.0.1:8045:8045"
    volumes:
      - /home/aesc/.antigravity_tools:/root/.antigravity_tools
    environment:
      - LOG_LEVEL=info
      - API_KEY=${API_KEY}
      - WEB_PASSWORD=${WEB_PASSWORD}
      - ABV_BIND_LOCAL_ONLY=false
      - ABV_DATA_DIR=/root/.antigravity_tools
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 100.100.100.100
    mem_limit: 256m
    restart: unless-stopped
    # tini as PID 1 forwards SIGTERM; without it the app ignores SIGTERM and every
    # shutdown waits the full 10s docker stop timeout.
    init: true
    stop_grace_period: 2s
