# Shared Kitty base configuration across all desktop environments
font_family JetBrainsMono Nerd Font
font_size 11.5
background_opacity 0.6
background_tint 0.95
background_tint_gaps -10.0
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 10000
window_padding_width 8
window_border_width 1pt
window_margin_width 1
single_window_margin_width 0
inactive_text_alpha 0.6
active_border_color #227f7f
notify_on_cmd_finish unfocused 10.0

# Start at the floating size, even after a previous window was maximized.
remember_window_size no
initial_window_width 1050
initial_window_height 638

# Comic Mono font & cursor trail effects
include /home/aesc/.config/kitty/tonelico-comic-mono.conf
